<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101018"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Melody"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"><title>Melody · 我的音乐</title><style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#101018;color:#f7f6ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -15%,#43326c 0%,#171521 45%,#101018 78%);min-height:100vh}.app{max-width:600px;margin:auto;padding:calc(env(safe-area-inset-top) + 24px) 20px calc(env(safe-area-inset-bottom) + 130px)}header{display:flex;align-items:center;justify-content:space-between}h1{font-size:30px;letter-spacing:-1px;margin:0}small,.muted{color:#a9a5b9}.logo{display:flex;gap:10px;align-items:center}.logo span{display:grid;place-items:center;width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,#a77bff,#6655ff);font-size:23px}.pill{border:1px solid #504760;border-radius:99px;padding:9px 13px;background:#ffffff0c;color:#eee;font-weight:600}button{cursor:pointer;color:inherit;font:inherit}button:disabled{opacity:.35;cursor:default}.hero{margin-top:32px;border:1px solid #ffffff1c;border-radius:28px;background:linear-gradient(145deg,#393050,#201c2c);padding:24px;box-shadow:0 20px 60px #0004}.cover{width:min(58vw,220px);height:min(58vw,220px);margin:8px auto 25px;border-radius:30px;background:linear-gradient(135deg,#a477fb,#513fc3 65%,#1f194b);display:grid;place-items:center;font-size:88px;box-shadow:0 20px 45px #08051188}.track{text-align:center;font-size:22px;font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.subtitle{text-align:center;color:#b8b1c8;font-size:13px;margin:8px 0 22px}.seek{width:100%;accent-color:#bda1ff}.times{display:flex;justify-content:space-between;font-size:12px;color:#b6aec7;margin-top:3px}.controls{display:flex;justify-content:center;align-items:center;gap:20px;margin-top:12px}.controls button{border:0;background:transparent;font-size:27px;padding:10px}.controls .play{background:#eee9ff;color:#201632;width:66px;height:66px;border-radius:50%;font-size:28px}.controls .active{color:#c5a5ff}.section{display:flex;justify-content:space-between;align-items:center;margin:28px 0 13px}.section h2{font-size:20px;margin:0}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{background:#282433;border:1px solid #4b415a;border-radius:12px;padding:10px 14px}.search{width:100%;border:1px solid #4b415a;background:#201d2a;color:white;border-radius:14px;padding:14px;font-size:15px;outline:none}.list{margin-top:14px}.song{display:flex;align-items:center;gap:12px;padding:13px 8px;border-bottom:1px solid #ffffff12}.song.current{background:#8d63f51a;border-radius:12px}.mini{background:#44365d;width:43px;height:43px;display:grid;place-items:center;border-radius:11px;flex-shrink:0}.song .info{min-width:0;flex:1;cursor:pointer}.song .name{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.song .meta{font-size:12px;color:#aaa4b8;margin-top:4px}.song button{border:0;background:transparent;color:#bbb2d1;font-size:21px;padding:7px}.empty{padding:35px 10px;text-align:center;color:#aca5b8;line-height:1.8}.note{font-size:12px;line-height:1.6;color:#a7a1b7;margin-top:22px}input[type=file]{display:none}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#e7dbff;color:#211533;border-radius:14px;padding:12px 18px;display:none;max-width:90vw;text-align:center;z-index:9}
</style></head><body><div class="app"><header><div class="logo"><span>♫</span><div><h1>Melody</h1><small>你的私人音乐空间</small></div></div><button class="pill" id="install">安装说明</button></header><section class="hero"><div class="cover">♫</div><div class="track" id="currentName">还没有播放音乐</div><div class="subtitle" id="currentMeta">添加歌曲，开始聆听</div><input type="range" id="seek" class="seek" min="0" max="100" value="0"><div class="times"><span id="elapsed">0:00</span><span id="duration">0:00</span></div><div class="controls"><button id="shuffle" title="随机播放">⤨</button><button id="prev" title="上一首">⏮</button><button id="play" class="play" title="播放或暂停">▶</button><button id="next" title="下一首">⏭</button><button id="repeat" title="循环模式">↻</button></div></section><div class="section"><h2>音乐库 <small id="count">0 首</small></h2><div class="actions"><button id="add">＋ 导入音乐</button><button id="favorites">全部歌曲</button></div></div><input id="files" type="file" accept="audio/*,.mp3,.m4a,.aac,.wav,.flac" multiple><input class="search" id="search" placeholder="搜索歌曲名称"><div id="list" class="list"></div><div class="note">歌曲仅保存在当前设备的浏览器存储中，不会上传服务器。iOS 可能清理网站数据；重要音乐请保留原文件。后台播放和锁屏控制取决于 Safari/iOS 的支持情况。</div></div><div class="toast" id="toast"></div><audio id="audio" preload="metadata"></audio><script>
const $=id=>document.getElementById(id),audio=$('audio');let db,songs=[],index=-1,shuffle=false,repeat=0,onlyFav=false,objectUrl=null,loading=false;const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function toast(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').style.display='none',3500)}function fmt(n){if(!Number.isFinite(n))return '0:00';return `${Math.floor(n/60)}:${String(Math.floor(n%60)).padStart(2,'0')}`}
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open('melody-library',1);r.onupgradeneeded=()=>{r.result.createObjectStore('songs',{keyPath:'id'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}function tx(mode){return db.transaction('songs',mode).objectStore('songs')}function getAll(){return new Promise((res,rej)=>{const r=tx('readonly').getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}function put(s){return new Promise((res,rej)=>{const r=tx('readwrite').put(s);r.onsuccess=res;r.onerror=()=>rej(r.error)})}function del(id){return new Promise((res,rej)=>{const r=tx('readwrite').delete(id);r.onsuccess=res;r.onerror=()=>rej(r.error)})}async function refresh(){songs=(await getAll()).sort((a,b)=>a.added-b.added);render()}function render(){let q=$('search').value.trim().toLowerCase();let visible=songs.filter(s=>(!onlyFav||s.favorite)&&s.name.toLowerCase().includes(q));$('count').textContent=`${songs.length} 首`;$('favorites').textContent=onlyFav?'♥ 收藏中':'全部歌曲';$('list').innerHTML=visible.length?visible.map(s=>{let i=songs.findIndex(x=>x.id===s.id);return `<div class="song ${i===index?'current':''}"><div class="mini">♫</div><div class="info" data-play="${s.id}"><div class="name">${escapeHtml(s.name)}</div><div class="meta">${(s.blob.size/1048576).toFixed(1)} MB</div></div><button data-fav="${s.id}" title="收藏">${s.favorite?'♥':'♡'}</button><button data-del="${s.id}" title="删除歌曲">×</button></div>`}).join(''):'<div class="empty">音乐库还是空的<br>点击「＋ 导入音乐」选择 MP3 或 M4A</div>'}function updatePlay(){$('play').textContent=audio.paused?'▶':'Ⅱ';if('mediaSession'in navigator)navigator.mediaSession.playbackState=audio.paused?'paused':'playing'}async function playIndex(i){if(i<0||i>=songs.length)return;index=i;const s=songs[i];audio.pause();if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl=URL.createObjectURL(s.blob);audio.src=objectUrl;$('currentName').textContent=s.name;$('currentMeta').textContent='Melody · 本地音乐';render();if('mediaSession'in navigator){navigator.mediaSession.metadata=new MediaMetadata({title:s.name,artist:'本地音乐',album:'Melody'});}try{await audio.play()}catch(e){toast('无法自动播放，请点击播放按钮')}updatePlay()}function next(step=1){if(!songs.length)return;if(shuffle&&songs.length>1){let i;do{i=Math.floor(Math.random()*songs.length)}while(i===index);playIndex(i)}else playIndex((index+step+songs.length)%songs.length)}async function importFiles(files){if(loading)return;loading=true;let added=0,failed=0;try{for(const f of files){if(!(/\.(mp3|m4a|aac|wav|flac|ogg)$/i.test(f.name)||f.type.startsWith('audio/')))continue;try{await put({id:crypto.randomUUID(),name:f.name.replace(/\.[^.]+$/,''),blob:f,added:Date.now()+added,favorite:false});added++}catch(e){failed++;}}await refresh();toast(`已导入 ${added} 首${failed?'，失败 '+failed+' 首（可能存储空间不足）':''}`)}finally{loading=false;$('files').value=''}}
$('add').onclick=()=>$('files').click();$('files').onchange=e=>importFiles([...e.target.files]);$('search').oninput=render;$('favorites').onclick=()=>{onlyFav=!onlyFav;render()};$('list').onclick=async e=>{const p=e.target.closest('[data-play]'),f=e.target.closest('[data-fav]'),d=e.target.closest('[data-del]');if(p)playIndex(songs.findIndex(s=>s.id===p.dataset.play));if(f){let s=songs.find(x=>x.id===f.dataset.fav);s.favorite=!s.favorite;await put(s);render()}if(d){let id=d.dataset.del;if(!confirm('删除这首歌曲？'))return;let active=songs[index]?.id===id;await del(id);if(active){audio.pause();audio.removeAttribute('src');audio.load();index=-1;$('currentName').textContent='还没有播放音乐';$('currentMeta').textContent='添加歌曲，开始聆听';updatePlay()}await refresh()}};$('play').onclick=()=>{if(!audio.src){if(songs.length)playIndex(0);else toast('请先导入音乐');return}audio.paused?audio.play().catch(()=>toast('播放失败，可能不支持该音频格式')):audio.pause()};$('prev').onclick=()=>{if(audio.currentTime>3)audio.currentTime=0;else next(-1)};$('next').onclick=()=>next(1);$('shuffle').onclick=()=>{shuffle=!shuffle;$('shuffle').classList.toggle('active',shuffle);toast(shuffle?'随机播放已开启':'随机播放已关闭')};$('repeat').onclick=()=>{repeat=(repeat+1)%3;$('repeat').textContent=['↻','↻','↻¹'][repeat];$('repeat').classList.toggle('active',repeat>0);toast(['循环全部','单曲循环','播放完停止'][repeat])};audio.ontimeupdate=()=>{$('elapsed').textContent=fmt(audio.currentTime);$('seek').value=audio.duration?100*audio.currentTime/audio.duration:0;if('mediaSession'in navigator&&navigator.mediaSession.setPositionState&&Number.isFinite(audio.duration)){try{navigator.mediaSession.setPositionState({duration:audio.duration,playbackRate:audio.playbackRate,position:Math.min(audio.currentTime,audio.duration)})}catch(e){}}};audio.onloadedmetadata=()=>$('duration').textContent=fmt(audio.duration);$('seek').oninput=e=>{if(Number.isFinite(audio.duration))audio.currentTime=audio.duration*Number(e.target.value)/100};audio.onplay=updatePlay;audio.onpause=updatePlay;audio.onended=()=>{if(repeat===1){audio.currentTime=0;audio.play()}else if(repeat===2){updatePlay()}else next(1)};audio.onerror=()=>{if(audio.src)toast('播放失败：格式不支持或文件损坏')};if('mediaSession'in navigator){const actions={play:()=>audio.play(),pause:()=>audio.pause(),previoustrack:()=>next(-1),nexttrack:()=>next(1),seekto:d=>{audio.currentTime=d.seekTime}};for(let [k,v] of Object.entries(actions)){try{navigator.mediaSession.setActionHandler(k,v)}catch(e){}}}$('install').onclick=()=>alert('iPhone：用 Safari 打开此网站 → 点击分享按钮 →「添加到主屏幕」。首次打开需要联网；添加后可尝试离线使用。');(async()=>{try{db=await openDB();await refresh()}catch(e){toast('无法访问本地音乐存储，请使用 Safari 或 Chrome 正常模式')}})();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
